apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee
  labels:
    app: employee
spec:
  selector:
    matchLabels:
      app: employee
  template:
    metadata:
      labels:
        app: employee
    spec:
      serviceAccountName: api-service-account
      containers:
        - name: employee
          image: vmware/employee:1.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: "0.2"
              memory: 384Mi
            limits:
              cpu: "1.0"
              memory: 512Mi
          readinessProbe:
            httpGet:
              port: http
              path: /actuator/health
            initialDelaySeconds: 60
            timeoutSeconds: 10
            periodSeconds: 20
            failureThreshold: 10
          livenessProbe:
            httpGet:
              port: http
              path: /actuator/info
            initialDelaySeconds: 60
            timeoutSeconds: 10
            periodSeconds: 20
            failureThreshold: 10
          volumeMounts:
            - name: mongodb
              mountPath: /etc/secretspot
      volumes:
        - name: mongodb
          secret:
            secretName: employee
