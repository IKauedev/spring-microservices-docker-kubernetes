spring:
  config:
    # ConfigMap/Secret loading is opt-in via spring.config.import since
    # Spring Cloud stopped processing bootstrap.yml/context by default
    import: "optional:kubernetes:"
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
