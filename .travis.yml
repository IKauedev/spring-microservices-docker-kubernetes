# Travis CI Java documentation: https://docs.travis-ci.com/user/languages/java/
language: java
dist: jammy

env:
  global:
    - MAVEN_OPTS="-Djava.awt.headless=true -XX:+UseG1GC -Dfile.encoding=UTF-8"

cache:
  directories:
    - $HOME/.m2

install: true

# One job per microservice instead of a single reactor build, so a broken
# service shows up as its own red job rather than as "the build failed".
jobs:
  include:
    - stage: build & test
      name: employee-service
      jdk: openjdk17
      script: mvn -B -pl employee-service clean verify

    - stage: build & test
      name: department-service
      jdk: openjdk17
      script: mvn -B -pl department-service clean verify

    - stage: build & test
      name: organization-service
      jdk: openjdk17
      script: mvn -B -pl organization-service clean verify

    - stage: build & test
      name: gateway-service
      jdk: openjdk17
      script: mvn -B -pl gateway-service clean verify

notifications:
  email:
    recipients:
      - ikauedeveloper@gmail.com
    on_success: never
    on_failure: always
