name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# um novo push cancela a execucao anterior da mesma branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # compila e roda os testes de cada microsservico em paralelo
  # ---------------------------------------------------------------------------
  build-test:
    name: build & test (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [employee, department, organization, gateway]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: mvn verify
        run: mvn -B -ntp -pl ${{ matrix.service }}-service verify

      - name: Relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.service }}
          path: ${{ matrix.service }}-service/target/surefire-reports
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # valida os scripts shell e o docker-compose.yml
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Sintaxe e shellcheck dos scripts
        run: |
          mapfile -t scripts < <(git ls-files 'scripts/**/*.sh')
          for f in "${scripts[@]}"; do bash -n "$f"; done
          shellcheck --severity=error "${scripts[@]}"

      - name: docker compose config
        run: docker compose config --quiet

  # ---------------------------------------------------------------------------
  # sobe a stack inteira (compose) e exercita a API pelo gateway
  # ---------------------------------------------------------------------------
  smoke-test:
    needs: [build-test, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Sobe a stack
        run: docker compose up -d --build

      - name: Smoke test (gateway -> employee/department/organization -> MongoDB)
        run: scripts/ci/smoke-test.sh http://localhost:8080
        env:
          WAIT_SECONDS: "300"

      - name: Logs dos containers
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Derruba a stack
        if: always()
        run: docker compose down -v
