apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: organization
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/IKauedev/spring-microservices-docker-kubernetes.git
    targetRevision: master
    path: k8s/organization
  destination:
    server: https://kubernetes.default.svc
    namespace: organization
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # o HPA controla o numero de replicas; o Argo nao deve reverter isso
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
