# App of apps: aplicando so este arquivo, o Argo CD passa a criar e
# sincronizar todas as Applications de argocd/applications/.
#   kubectl apply -n argocd -f argocd/root-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/IKauedev/spring-microservices-docker-kubernetes.git
    targetRevision: master
    path: argocd/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
